<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      .anim-pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
      .anim-float { animation: float 4s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="200" cy="90" r="140" fill="url(#glowGrad)" class="anim-pulse" filter="url(#glow)" />
  <circle cx="1020" cy="270" r="160" fill="url(#glowGrad)" class="anim-pulse" filter="url(#glow)" />
  <circle cx="950" cy="70" r="100" fill="#38bdf8" opacity="0.12" class="anim-pulse" filter="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4" class="anim-dash">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Top Pill Badge -->
  <g class="anim-float">
    <rect x="440" y="38" width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <text x="600" y="59" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">⚡ 2026 REVENUE PLAYBOOK</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">
    BEST WAYS TO MAKE MONEY ONLINE
  </text>
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="3">
    IN 2026
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    High-Leverage Systems • AI Automation Consulting • Scalable Content • Micro-SaaS
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">🤖 AI Integrations</text>
    
    <!-- Pill 2 -->
    <rect x="220" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.85" />
    <text x="310" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">📦 Digital Products</text>

    <!-- Pill 3 -->
    <rect x="440" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.85" />
    <text x="530" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">📈 High-ROI Ecom</text>

    <!-- Pill 4 -->
    <rect x="660" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1" opacity="0.85" />
    <text x="750" y="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#fda4af" text-anchor="middle">⚡ Fast Setup</text>
  </g>
</svg>
